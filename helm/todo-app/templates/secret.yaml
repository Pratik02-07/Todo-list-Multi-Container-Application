{{- if not .Values.mongodb.auth.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.secretName" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongo-root-username: {{ .Values.mongodb.auth.rootUsername | quote }}
  mongo-root-password: {{ .Values.mongodb.auth.rootPassword | quote }}
  mongo-uri: {{ printf "mongodb://%s:%s@%s:%d/%s?authSource=admin" .Values.mongodb.auth.rootUsername (urlquery .Values.mongodb.auth.rootPassword) (printf "%s-mongodb" (include "todo-app.fullname" .)) (int .Values.mongodb.service.port) .Values.mongodb.database | quote }}
{{- end }}
