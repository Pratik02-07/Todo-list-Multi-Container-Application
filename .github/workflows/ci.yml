
name: Todo Application CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Validate EKS Kustomize overlay
        run: kubectl kustomize k8s/overlays/eks > "$RUNNER_TEMP/eks-manifests.yaml"

      - name: Audit production dependencies
        run: npm audit --omit=dev

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: quality

    # Publish only when a semantic version tag is pushed.
    # Main pushes and PR merges run quality checks but do not build images.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          git fetch origin main --no-tags

          if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
            echo "Release tag must point to a commit already reachable from main."
            exit 1
          fi

          echo "Verified release $RELEASE_TAG at $RELEASE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            pratik0207/todolist-backend:sha-${{ github.sha }}
            pratik0207/todolist-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            pratik0207/todolist-frontend:sha-${{ github.sha }}
            pratik0207/todolist-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
