apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-app

resources:
  - ../../base
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - ingress.yaml

images:
  - name: pratik0207/todolist-backend
    newTag: sha-REPLACE_WITH_COMMIT_SHA
  - name: pratik0207/todolist-frontend
    newTag: sha-REPLACE_WITH_COMMIT_SHA

patches:
  - path: frontend-service.patch.yaml
  - path: mongodb-storage.patch.yaml
