<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List — Native App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header class="app-header">
      <div class="header-left">
        <h1>Todo List - v1.1.0</h1>
        <p class="subtitle">Multi-Container Architecture</p>
      </div>
    </header>

    <div id="error-alert" class="alert-banner hidden" role="alert"></div>

    <section class="card form-card">
      <h2>Add New Task</h2>
      <form id="todo-form">
        <div class="form-group">
          <label for="todo-title">Task Title *</label>
          <input type="text" id="todo-title" name="title" placeholder="What needs to be done?" required maxlength="200"
            autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="todo-desc">Description (Optional)</label>
          <input type="text" id="todo-desc" name="description" placeholder="Add extra details..." maxlength="1000"
            autocomplete="off" />
        </div>
        <button type="submit" id="btn-add-todo" class="btn btn-primary">Add Task</button>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Your Tasks</h2>
        <div class="task-stats">
          <span class="stat-item">Total: <strong id="total-count">0</strong></span>
          <span class="stat-item">Completed: <strong id="completed-count">0</strong></span>
        </div>
      </div>
      <div id="todo-list" class="todo-list">
        <div class="loading-state">Loading tasks...</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>

</html>
