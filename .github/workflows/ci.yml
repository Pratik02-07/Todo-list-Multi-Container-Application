name: Todo Application CI

on:
  push:
    branches:
      - main
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Test, Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Validate EKS Kustomize overlay
        run: kubectl kustomize k8s/overlays/eks > "$RUNNER_TEMP/eks-manifests.yaml"

      - name: Audit production dependencies
        run: npm audit --omit=dev

  security-scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  build-and-push:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    needs: [quality, security-scan]

    # Publish images on merge to main, version release tags, or manual dispatch
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Image Tags
        id: tags
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:8}"
          TAGS_BACKEND="pratik0207/todolist-backend:sha-${COMMIT_SHA},pratik0207/todolist-backend:sha-${SHORT_SHA}"
          TAGS_FRONTEND="pratik0207/todolist-frontend:sha-${COMMIT_SHA},pratik0207/todolist-frontend:${SHORT_SHA}"

          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            TAGS_BACKEND="${TAGS_BACKEND},pratik0207/todolist-backend:${RELEASE_TAG}"
            TAGS_FRONTEND="${TAGS_FRONTEND},pratik0207/todolist-frontend:${RELEASE_TAG}"
          fi

          echo "backend_tags=${TAGS_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${TAGS_FRONTEND}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.tags.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
